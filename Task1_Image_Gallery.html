<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            padding: 20px;
            color: #333;
        }

        /* Search */
        .search-box {
            text-align: center;
            margin: 10px 20px;
        }

        .search-box input {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
        }

        /* Category buttons */
        .filters {
            text-align: center;
            margin: 20px;
        }

        .filters button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        .filters button:hover {
            background: #555;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 20px;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .image-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .image-card img:hover {
            transform: scale(1.03);
            opacity: 0.8;
        }

        .image-card h3 {
            margin: 10px 5px 5px;
        }

        .image-card p {
            margin: 5px;
            color: #777;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close,
        .prev,
        .next {
            position: absolute;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .close {
            top: 20px;
            right: 30px;
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }
    </style>
</head>

<body>

<h1>📸 My Image Gallery</h1>

<!-- Search -->
<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="🔍 Search images..."
        onkeyup="searchImages()"
    >
</div>

<!-- Categories -->
<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('animals')">Animals</button>
    <button onclick="filterImages('places')">Places</button>
</div>

<!-- Gallery -->
<div class="gallery">

    <div class="image-card"
         data-category="nature"
         data-name="mountain nature">
        <img
            src="https://picsum.photos/id/1015/600/400"
            onclick="openImage(0)"
        >
        <h3>Mountain</h3>
        <p>Nature</p>
    </div>

    <div class="image-card"
         data-category="nature"
         data-name="forest nature">
        <img
            src="https://picsum.photos/id/1018/600/400"
            onclick="openImage(1)"
        >
        <h3>Forest</h3>
        <p>Nature</p>
    </div>

    <div class="image-card"
         data-category="animals"
         data-name="dog animal">
        <img
            src="https://picsum.photos/id/1025/600/400"
            onclick="openImage(2)"
        >
        <h3>Dog</h3>
        <p>Animals</p>
    </div>

    <div class="image-card"
         data-category="places"
         data-name="city buildings">
        <img
            src="https://picsum.photos/id/1035/600/400"
            onclick="openImage(3)"
        >
        <h3>City</h3>
        <p>Places</p>
    </div>

    <div class="image-card"
         data-category="nature"
         data-name="lake nature">
        <img
            src="https://picsum.photos/id/1043/600/400"
            onclick="openImage(4)"
        >
        <h3>Lake</h3>
        <p>Nature</p>
    </div>

    <div class="image-card"
         data-category="places"
         data-name="architecture building">
        <img
            src="https://picsum.photos/id/1050/600/400"
            onclick="openImage(5)"
        >
        <h3>Architecture</h3>
        <p>Places</p>
    </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">

    <span class="close" onclick="closeImage()">×</span>

    <span class="prev" onclick="changeImage(-1)">❮</span>

    <img id="lightboxImage">

    <span class="next" onclick="changeImage(1)">❯</span>

</div>

<script>

    const images = [
        "https://picsum.photos/id/1015/600/400",
        "https://picsum.photos/id/1018/600/400",
        "https://picsum.photos/id/1025/600/400",
        "https://picsum.photos/id/1035/600/400",
        "https://picsum.photos/id/1043/600/400",
        "https://picsum.photos/id/1050/600/400"
    ];

    let currentIndex = 0;

    /* Open image */
    function openImage(index) {

        currentIndex = index;

        document.getElementById("lightboxImage").src =
            images[currentIndex];

        document.getElementById("lightbox").style.display =
            "flex";
    }

    /* Close image */
    function closeImage() {

        document.getElementById("lightbox").style.display =
            "none";
    }

    /* Previous / Next */
    function changeImage(direction) {

        currentIndex += direction;

        if (currentIndex < 0) {
            currentIndex = images.length - 1;
        }

        if (currentIndex >= images.length) {
            currentIndex = 0;
        }

        document.getElementById("lightboxImage").src =
            images[currentIndex];
    }

    /* Category filter */
    function filterImages(category) {

        const cards =
            document.querySelectorAll(".image-card");

        cards.forEach(function(card) {

            if (
                category === "all" ||
                card.dataset.category === category
            ) {
                card.style.display = "block";
            }
            else {
                card.style.display = "none";
            }

        });
    }

    /* Search */
    function searchImages() {

        const searchText =
            document.getElementById("search")
            .value
            .toLowerCase();

        const cards =
            document.querySelectorAll(".image-card");

        cards.forEach(function(card) {

            const name =
                card.dataset.name.toLowerCase();

            if (name.includes(searchText)) {
                card.style.display = "block";
            }
            else {
                card.style.display = "none";
            }

        });
    }

</script>

</body>
</html>
